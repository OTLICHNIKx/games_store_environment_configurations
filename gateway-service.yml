
spring:
  cloud:
    config:
      enabled: true
    gateway:
      discovery:
        locator:
          enabled: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowed-origins: "http://localhost:5173"
            allowed-methods:
              - GET
              - POST
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true

      routes:
        # Games Service
        - id: games-catalogue
          uri: lb://games-service
          predicates:
            - Path=/games/v1/catalogue/**

        # Cart Service
        - id: cart-update
          uri: lb://cart-service
          predicates:
            - Path=/cart/v1/update

        - id: cart-content
          uri: lb://cart-service
          predicates:
            - Path=/cart/v1/content

        - id: cart-purchase
          uri: lb://cart-service
          predicates:
            - Path=/cart/v1/purchase/**

        # Login Service
        - id: login-authorization
          uri: lb://login-service
          predicates:
            - Path=/login/v1/authorization

        - id: login-registration
          uri: lb://login-service
          predicates:
            - Path=/login/v1/registration

        # Orders Service
        - id: orders-purchases
          uri: lb://orders-service
          predicates:
            - Path=/orders/v1/purchases/**
